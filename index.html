<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildTab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <video autoplay muted loop playsinline id="wallpaper">
    <source src="assets/wallpaper.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<div class="overlay"></div>

<main>
    
    <div id="clock"></div>
    <div id="date"></div>

    <form id="search-form">
      <input id="search" type="text" placeholder="Search"
      autocomplete="off">
      <button type="submit">↗</button>

    </form>

    <div id="icons-grid">

        <div class="icons-card">
            <img src="assets/icons/hc.png">
            <div>HackClub</div>
        </div>

         <div class="icons-card">
            <img src="assets/icons/chatgpt.png">
            <div>ChatGpt</div>
        </div>

         <div class="icons-card">
            <img src="assets/icons/yt.png">
            <div>YouTube</div>
        </div>

         <div class="icons-card">
            <img src="assets/icons/claude.png">
            <div>Claude</div>
        </div>

    </div>

    <div id="greetings"></div>



    <div>
        <img src="assets/icons/settings.png" id="settings-icon">
    </div>
    <div id="settings-window">
        <audio src="assets/forest.mp3" loop id="forest-song"></audio>
        <div id="song-box">
          <div id="song-h1">Forest Ambience Sound</div>
           <div id="play-btn">play</div>
          <div id="stop-btn">stop</div>
        </div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
